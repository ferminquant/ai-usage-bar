# Cargo.lock records `ssh-key`'s optional RSA support even though this
# application enables only Ed25519 signing. Cargo-audit scans that lock
# metadata rather than the activated feature graph. The advisory applies to
# the unused optional dependency; there is no fixed upstream release. Keep the
# exception documented in the repository while avoiding a false CI failure.
[advisories]
ignore = ["RUSTSEC-2023-0071"]
