name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux tests and clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Intentional dedicated gate (also covered by linux --all-targets) so contract
  # and invariant failures surface under a named job and can be required alone.
  contract-and-invariants:
    name: Contract, invariant, and acceptance tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run contract tests
        run: cargo test --test contract --all-features
      - name: Run invariant tests
        run: cargo test --test invariants --all-features
      - name: Run acceptance tests
        run: cargo test --test acceptance --all-features

  windows:
    name: Windows shell tests and clippy
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  security:
    name: Security scans and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Scan tracked files for high-confidence secrets
        run: python scripts/check_secrets.py
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit --json > cargo-audit.json
      - name: Add dependency audit to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Dependency audit'
            echo '```json'
            cat cargo-audit.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# Keep these first gates on GitHub-hosted runners. Issue #15 tracks the
# separate registration, labels, isolation, and cleanup policy needed before
# any public pull request can execute on a Budget workspace runner.
