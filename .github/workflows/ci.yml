name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux tests and clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Intentional dedicated gate (also covered by linux --all-targets) so contract
  # and invariant failures surface under a named job and can be required alone.
  contract-and-invariants:
    name: Contract, invariant, and acceptance tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run contract tests
        run: cargo test --test contract --all-features
      - name: Run invariant tests
        run: cargo test --test invariants --all-features
      - name: Run acceptance tests
        run: cargo test --test acceptance --all-features

  quality:
    name: Coverage and mutation quality ratchet
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install coverage and mutation tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Install mutation tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Test quality gate script
        run: python -m unittest discover --start-directory scripts --pattern 'test_*.py'
      - name: Collect line coverage
        shell: bash
        run: |
          mkdir -p quality-output
          cargo llvm-cov --all-features --all-targets --json --summary-only \
            --output-path quality-output/coverage.json
      - name: Run bounded policy-core mutation suite
        continue-on-error: true
        run: >-
          cargo mutants --all-features
          --file src/model.rs
          --file src/daemon.rs
          --re 'RefreshPolicy::normalized|UsageSnapshot::(validate|is_percentage|has_safe_account_id)|SnapshotCache::(try_store_live|cached_snapshots|get|for_provider)|classify_cached|aggregate_freshness|sanitize_adapter_snapshot|invalid_window_outcome'
          --jobs 2
          --timeout 120
          --build-timeout 600
          --no-shuffle
          --baseline run
      - name: Evaluate quality gates
        run: >-
          python scripts/check_quality.py
          --coverage quality-output/coverage.json
          --mutants mutants.out/outcomes.json
          --thresholds quality/thresholds.json
          --summary-out quality-output/quality-summary.json
      - name: Add quality summary to job summary
        if: always()
        shell: bash
        run: |
          if [ -f quality-output/quality-summary.json ]; then
            echo '### Quality ratchet' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat quality-output/quality-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: |
            quality-output/
            mutants.out/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows shell tests and clippy
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  windows-package:
    name: Windows packaging and smoke tests
    needs: windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build release entrypoints
        run: cargo build --release --locked --bin ai-usage-bar --bin ai-usage-bar-shell
      - name: Assemble portable package
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "package-output"
          & "$env:GITHUB_WORKSPACE\packaging\package.ps1" `
            -Version "0.1.0-ci.${{ github.run_number }}" `
            -OutputDirectory $output `
            -SkipBuild
      - name: Run clean-profile packaging smoke test
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "package-output"
          $packagePath = Join-Path $output "ai-usage-bar-0.1.0-ci.${{ github.run_number }}-windows-x64.zip"
          $package = Get-Item -LiteralPath $packagePath -ErrorAction SilentlyContinue
          if ($null -eq $package) {
            throw "Expected package ZIP was not produced: $packagePath"
          }
          $summary = Join-Path $output "smoke-summary.json"
          & "$env:GITHUB_WORKSPACE\packaging\smoke-test.ps1" `
            -PackagePath $package.FullName `
            -SummaryPath $summary
      - name: Upload Windows package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: package-output/
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Security scans and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Scan tracked files for high-confidence secrets
        run: python scripts/check_secrets.py
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit --json > cargo-audit.json
      - name: Add dependency audit to job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Dependency audit'
            echo '```json'
            cat cargo-audit.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# Keep these first gates on GitHub-hosted runners. Issue #15 tracks the
# separate registration, labels, isolation, and cleanup policy needed before
# any public pull request can execute on a Budget workspace runner.
