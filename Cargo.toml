[package]
name = "ai-usage-bar"
version = "0.1.5"
edition = "2021"
description = "Desktop usage widget for hosted AI subscriptions"
license = "MIT OR Apache-2.0"

[lib]
name = "ai_usage_bar"
path = "src/lib.rs"

[[bin]]
name = "ai-usage-bar"
path = "src/bin/ai-usage-bar.rs"

[[bin]]
name = "ai-usage-bar-shell"
path = "src/bin/shell.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
thiserror = "2"
ureq = { version = "2", default-features = true, features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "std"] }
signature = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[dev-dependencies]
pretty_assertions = "1"
proptest = "1"
