[package]
name = "ai-usage-bar"
version = "0.1.0"
edition = "2021"
description = "Local-first desktop usage widget for AI subscriptions and local model runtimes"
license = "MIT OR Apache-2.0"

[lib]
name = "ai_usage_bar"
path = "src/lib.rs"

[[bin]]
name = "ai-usage-bar"
path = "src/bin/ai-usage-bar.rs"

[[bin]]
name = "ai-usage-bar-shell"
path = "src/bin/shell.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tray-icon = { version = "0.24", default-features = false }
tao = { version = "0.36", default-features = false, features = ["rwh_06"] }

[dev-dependencies]
pretty_assertions = "1"