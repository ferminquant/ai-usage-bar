[package]
name = "ai-usage-bar"
version = "0.1.0"
edition = "2021"
description = "Local-first desktop usage widget for AI subscriptions and local model runtimes"
license = "MIT OR Apache-2.0"

[lib]
name = "ai_usage_bar"
path = "src/lib.rs"

[[bin]]
name = "ai-usage-bar"
path = "src/bin/ai-usage-bar.rs"

[[bin]]
name = "ai-usage-bar-shell"
path = "src/bin/shell.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
pretty_assertions = "1"
